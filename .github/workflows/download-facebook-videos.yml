name: Download Facebook videos

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Facebook video URLs, separated by commas"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: facebook-video-download
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download HD videos
        env:
          VIDEO_URLS: ${{ inputs.urls }}
        run: python scripts/fetch_videos.py

      - name: Commit MP4 files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/*.mp4
          if git diff --cached --quiet; then
            echo "No new video files to commit."
            exit 0
          fi
          git commit -m "Add downloaded Facebook videos"
          git push
